<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#05050a">
  <title>CRITICAL STRIKE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <!-- Жесткий контейнер -->
  <div id="game-container">
    <canvas id="game"></canvas>
    <!-- Поле ввода для никнейма, кода комнаты и чата корпоратива -->
    <input id="text-input" type="text" autocomplete="off" spellcheck="false">
  </div>

  <!-- Переключатель Critical Strike / DLC «Расследование Аулета» -->
  <button id="mode-btn" onclick="window.switchMode(window.AULET && AULET.active ? 'cs' : 'aulet')"></button>

  <!-- Кнопка фуллскрина -->
  <button id="fs-btn" title="Полный экран">⛶</button>

  <!-- Мобильное управление (Игра): плавающие стики + кнопки под героя -->
  <div id="mobile-game-controls" class="mobile-overlay">
    <div id="zone-move" class="touch-zone"><span class="zone-hint">ДВИЖЕНИЕ</span></div>
    <div id="zone-aim" class="touch-zone"><span class="zone-hint">ПРИЦЕЛ · ТЯНИТЕ ДАЛЬШЕ — ОГОНЬ</span></div>
    <div id="stick-move" class="stick"><div class="stick-knob"></div></div>
    <div id="stick-aim" class="stick aim"><div class="stick-knob"></div></div>
    <div id="action-btns">
      <button class="abtn hero-skill" id="btn-kick"><span>НАВЫК</span></button>
      <button class="abtn" id="btn-ult"><span>БАБАХ</span></button>
      <button class="abtn" id="btn-grenade"><span>ГРАН</span><b>0</b></button>
      <button class="abtn hero-armed" id="btn-throw"><span>БРОС</span></button>
      <button class="abtn use-btn" id="btn-use"><span>E</span></button>
      <button class="abtn gym-only" id="btn-ball"><span>УДАР</span></button>
      <button class="abtn gym-only" id="btn-run"><span>БЕГ</span></button>
      <button class="abtn gym-only" id="btn-ready"><span>ГОТОВ</span></button>
    </div>
    <button id="btn-pause" class="pbtn">II</button>
    <button id="btn-map" class="pbtn pbtn-map">КАРТА</button>
  </div>

  <!-- Мобильное управление (Samsa Kombat): стик слева, кнопки ударов справа -->
  <div id="mobile-fight-controls" class="mobile-overlay">
    <div id="zone-fmove" class="touch-zone"><span class="zone-hint">ХОД · ВВЕРХ — ПРЫЖОК · ВНИЗ — ПРИСЕД</span></div>
    <div id="stick-fmove" class="stick"><div class="stick-knob"></div></div>
    <div id="fight-btns">
      <button class="fbtn" id="fbtn-s"><span>ПРИЁМ</span></button>
      <button class="fbtn" id="fbtn-b"><span>БЛОК</span></button>
      <button class="fbtn" id="fbtn-k"><span>НОГА</span></button>
      <button class="fbtn" id="fbtn-p"><span>РУКА</span></button>
    </div>
    <button class="fbtn fbtn-fatal" id="fbtn-f"><span>ФАТА<br>ЛИТИ</span></button>
    <button id="fbtn-pause" class="pbtn">II</button>
  </div>

  <!-- Мобильное управление (Меню) -->
  <div id="mobile-menu-controls" class="mobile-overlay">
    <button class="nbtn nbtn-back" id="btn-back">◀ НАЗАД</button>
    <div class="menu-nav-btns">
      <button class="nbtn" id="btn-up">▲</button>
      <button class="nbtn" id="btn-down">▼</button>
      <button class="nbtn nbtn-confirm" id="btn-enter">OK</button>
    </div>
  </div>

  <!-- Оверлей поворота -->
  <div id="rotate-overlay">
    <div class="rotate-icon">⟳</div>
    <p>Поверните телефон горизонтально</p>
  </div>

  <!-- Скрипты -->
  <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
  <script src="{{ url_for('static', filename='js/input.js') }}"></script>
  <script src="{{ url_for('static', filename='js/palette.js') }}"></script>
  <script src="{{ url_for('static', filename='js/audio.js') }}"></script>
  <script src="{{ url_for('static', filename='js/assets.js') }}"></script>
  <script src="{{ url_for('static', filename='js/camera.js') }}"></script>
  <script src="{{ url_for('static', filename='js/weapons.js') }}"></script>
  <script src="{{ url_for('static', filename='js/sprites.js') }}"></script>
  <script src="{{ url_for('static', filename='js/effects.js') }}"></script>
  <script src="{{ url_for('static', filename='js/explosives.js') }}"></script>
  <script src="{{ url_for('static', filename='js/decor.js') }}"></script>
  <script src="{{ url_for('static', filename='js/outdoor.js') }}"></script>
  <script src="{{ url_for('static', filename='js/door.js') }}"></script>
  <script src="{{ url_for('static', filename='js/entities/bullet.js') }}"></script>
  <script src="{{ url_for('static', filename='js/entities/pickup.js') }}"></script>
  <script src="{{ url_for('static', filename='js/entities/enemy.js') }}"></script>
  <script src="{{ url_for('static', filename='js/entities/player.js') }}"></script>
  <script src="{{ url_for('static', filename='js/boss.js') }}"></script>
  <script src="{{ url_for('static', filename='js/level.js') }}"></script>
  <script src="{{ url_for('static', filename='js/campaign.js') }}"></script>
  <script src="{{ url_for('static', filename='js/story.js') }}"></script>
  <script src="{{ url_for('static', filename='js/tutorial.js') }}"></script>
  <script src="{{ url_for('static', filename='js/allies.js') }}"></script>
  <script src="{{ url_for('static', filename='js/mission.js') }}"></script>
  <script src="{{ url_for('static', filename='js/p2p.js') }}"></script>
  <script src="{{ url_for('static', filename='js/coop.js') }}"></script>
  <script src="{{ url_for('static', filename='js/gym.js') }}"></script>
  <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
  <script src="{{ url_for('static', filename='js/modes.js') }}"></script>
  <script src="{{ url_for('static', filename='js/kombat_art.js') }}"></script>
  <script src="{{ url_for('static', filename='js/kombat_stages.js') }}"></script>
  <script src="{{ url_for('static', filename='js/kombat.js') }}"></script>
  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
  <script src="{{ url_for('static', filename='js/mobile.js') }}"></script>
  <!-- DLC «Расследование Аулета» -->
  <script src="{{ url_for('static', filename='js/aulet/engine.js') }}"></script>
  <script src="{{ url_for('static', filename='js/aulet/art.js') }}"></script>
  <script src="{{ url_for('static', filename='js/aulet/props.js') }}"></script>
  <script src="{{ url_for('static', filename='js/aulet/music.js') }}"></script>
  <script src="{{ url_for('static', filename='js/aulet/story_ch0.js') }}"></script>
  <script src="{{ url_for('static', filename='js/aulet/story_ch1.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
